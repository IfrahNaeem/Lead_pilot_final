# Add this "frontend" service to the project's root docker-compose.yml
# alongside the "backend" service the Backend Lead defines.
#
# Example root docker-compose.yml:
#
# services:
#   backend:
#     build: ./backend
#     ports:
#       - "8000:8000"
#     env_file:
#       - .env
#     volumes:
#       - ./backend/data:/app/data
#
#   frontend:
#     build: ./frontend
#     ports:
#       - "8501:8501"
#     environment:
#       # "backend" resolves via Docker's internal DNS to the backend service above
#       - BACKEND_URL=http://backend:8000
#     depends_on:
#       - backend

services:
  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
